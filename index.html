<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container"><h1>Mini Task Manager</h1><p>HTML, CSS, JavaScript practice test</p></div>
  </header>
  <main class="container">
    <!-- A: Form thêm công việc -->
    <section class="card">
      <form id="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Tên công việc <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="Nhập tên công việc...">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-due">Hạn hoàn thành</label>
            <input type="date" id="task-due">
          </div>
          <div class="form-group">
            <label for="task-priority">Mức ưu tiên</label>
            <select id="task-priority">
              <option value="Cao">Cao</option>
              <option value="Trung bình" selected>Trung bình</option>
              <option value="Thấp">Thấp</option>
            </select>
          </div>
        </div>
        <p id="error-msg" class="error" role="alert"></p>
        <button type="submit" class="btn btn-primary">Thêm công việc</button>
      </form>
    </section>

    <!-- A: Tìm kiếm, lọc trạng thái và vùng danh sách -->
    <section class="card">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Tìm kiếm công việc theo tên..." aria-label="Tìm kiếm công việc">
        <select id="status-filter" aria-label="Lọc theo trạng thái">
          <option value="all">Tất cả trạng thái</option>
          <option value="pending">Chưa hoàn thành</option>
          <option value="done">Đã hoàn thành</option>
        </select>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-msg" class="empty" hidden>Không có công việc nào.</p>
    </section>
  </main>
  <footer class="site-footer">
    <!-- Ghi rõ họ tên và mã sinh viên -->
    Sinh viên: Nguyễn Hải Vân  |  MSSV: 224001759
  </footer>
</body>
</html>
